<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root {
  --ink: #62536f;
  --cream: #fff8ef;
  --pink: #ffdce8;
  --green: #c8edc9;
}
* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: transparent;
  color: var(--ink);
  font-family: system-ui, 'Noto Sans KR', sans-serif;
}
.wrap { width: 100%; padding: 0; }
.hud {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 12px;
  background: #fffdf9;
  border: 1px solid #f3e3e8;
  border-radius: 16px 16px 0 0;
  font-size: 13px;
}
.pill {
  background: #ffedf3;
  border-radius: 999px;
  padding: 6px 11px;
}
.stage {
  position: relative;
  overflow: hidden;
  border: 2px solid #fff;
  border-radius: 0 0 18px 18px;
  box-shadow: 0 8px 24px #9d8baa25;
  background: #bfe9c3;
}
canvas {
  display: block;
  width: 100%;
  height: auto;
  touch-action: none;
}
.controls {
  display: flex;
  justify-content: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 10px 4px 4px;
}
.controls button {
  border: 1px solid #f0dce5;
  border-radius: 13px;
  background: linear-gradient(180deg, #fff, #fff3f7);
  color: #6c5a76;
  padding: 9px 14px;
  font-size: 15px;
  font-weight: 750;
  cursor: pointer;
  box-shadow: 0 3px 0 #e9d4df;
  user-select: none;
}
.controls button:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #e9d4df;
  background: #ffe2ec;
}
.msg {
  min-height: 34px;
  background: #fff5dc;
  border: 1px solid #f7e8b7;
  border-radius: 12px;
  padding: 8px 11px;
  font-size: 13px;
  margin-top: 7px;
}
.hint {
  font-size: 12px;
  color: #95869a;
  padding: 8px 2px;
}
.mobile { display: none; }
@media (max-width: 600px) {
  .mobile { display: block; }
  .hud { font-size: 11px; }
  .controls button { padding: 10px 12px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hud">
    <span class="pill">🌼 몽글마을 산책</span>
    <span id="berry">🍓 누적 몽글열매: 0</span>
    <span class="pill">이동: 방향키 / WASD · 말걸기: E</span>
  </div>

  <div class="stage">
    <canvas id="game" width="960" height="590"
      tabindex="0" aria-label="몽글마을 탐험 게임"></canvas>
  </div>

  <div class="controls">
    <button data-move="up">▲</button>
    <button data-move="left">◀</button>
    <button data-move="down">▼</button>
    <button data-move="right">▶</button>
    <button id="talk">💬 E 말걸기</button>
    <button id="reset">↺ 광장으로</button>
  </div>

  <div id="message" class="msg">
    안녕! 마을을 탐험하고 반짝이는 딸기를 주워 봐.
    입양한 펫은 네 뒤를 졸졸 따라올 거야!
  </div>

  <div class="hint">
    ✨ 열매를 주우면 마을 코인 +10, 경험치 +3을 받아.
    키보드가 반응하지 않으면 게임 화면을 한 번 클릭해 줘.
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  const VW = 960, VH = 590, MW = 1700, MH = 1250;
  let keys = {}, lastTime = 0, seq = 0;

  let props = {
    pet_emoji: '',
    pet_name: '',
    berry_count: 0,
    active_character: {
      name: '몽글이',
      hair: '#76564f',
      outfit: '#ffb7cf',
      accent: '#ffe6a7'
    }
  };

  const msg = document.getElementById('message');

  const load = () => {
    try {
      return JSON.parse(localStorage.getItem('mongle_explore_v2') || '{}');
    } catch (e) {
      return {};
    }
  };

  const saved = load();

  const player = {
    x: 760, y: 610,
    vx: 0, vy: 0,
    face: 1,
    walk: 0
  };

  if (
    saved.player &&
    Number.isFinite(saved.player.x) &&
    Number.isFinite(saved.player.y)
  ) {
    player.x = saved.player.x;
    player.y = saved.player.y;
  }

  let pet = { x: player.x - 34, y: player.y + 18 };

  const berrySpots = [
    [220,210], [430,300], [720,180], [1050,230],
    [1420,300], [1320,620], [1070,870], [740,1000],
    [360,850], [1550,1030], [880,430], [550,620]
  ];

  const got = new Set(saved.got || []);
  const berries = [];

  berrySpots.forEach((p, i) => {
    berries.push({
      x: p[0],
      y: p[1],
      id: i,
      got: got.has(i),
      phase: Math.random() * 6.28
    });
  });

  const npcs = [
    {
      x: 640, y: 570,
      name: '콩이', emoji: '🐻',
      line: '오늘은 딸기를 열 개 모아 보는 건 어때? 하나 주울 때마다 코인도 받을 수 있어!'
    },
    {
      x: 1120, y: 510,
      name: '구름 할머니', emoji: '👵🏻',
      line: '연못 옆 꽃길은 내가 가장 좋아하는 산책길이란다.'
    },
    {
      x: 920, y: 760,
      name: '토리', emoji: '🐰',
      line: '네 펫이랑 같이 산책하니까 더 신나지? 저기 반짝이는 딸기도 찾아봐!'
    }
  ];

  const trees = [];

  for (let y = 90; y < MH; y += 190) {
    for (
      let x = 90 + (Math.floor(y / 190) % 2) * 60;
      x < MW;
      x += 220
    ) {
      if (!(
        (x > 350 && x < 600 && y > 220 && y < 420) ||
        (x > 850 && x < 1200 && y > 280 && y < 520) ||
        (x > 650 && x < 980 && y > 680 && y < 930)
      )) {
        trees.push({
          x: x + (Math.sin(x * y) * 22),
          y: y + (Math.cos(x + y) * 18),
          scale: 0.8 + ((x + y) % 5) * 0.07
        });
      }
    }
  }

  const flowers = [];

  for (let i = 0; i < 160; i++) {
    flowers.push({
      x: (i * 193 + 41) % MW,
      y: (i * 127 + 77) % MH,
      r: 2 + (i % 3),
      h: i % 5
    });
  }

  const buildings = [
    {
      x: 440, y: 360, w: 150, h: 118,
      wall: '#fff0d9', roof: '#f3a6bf',
      name: '딸기 빵집', icon: '🥐', door: '#b98578'
    },
    {
      x: 1110, y: 370, w: 155, h: 118,
      wall: '#fff5ce', roof: '#d5b4ec',
      name: '포근 카페', icon: '☕', door: '#b98578'
    },
    {
      x: 770, y: 820, w: 150, h: 116,
      wall: '#ffe7ed', roof: '#eea7bd',
      name: '작은 집', icon: '🏡', door: '#b98578'
    },
    {
      x: 1330, y: 830, w: 150, h: 116,
      wall: '#e7e1ff', roof: '#b8b5f1',
      name: '별빛 도서관', icon: '📚', door: '#b98578'
    },
    {
      x: 250, y: 700, w: 125, h: 96,
      wall: '#fff5e8', roof: '#f6cc8b',
      name: '꽃집', icon: '🌷', door: '#b98578'
    }
  ];

  const pond = { x: 1280, y: 650, rx: 145, ry: 85 };

  function save() {
    localStorage.setItem(
      'mongle_explore_v2',
      JSON.stringify({
        player: { x: player.x, y: player.y },
        got: [...got]
      })
    );
  }

  function post(value) {
    window.parent.postMessage({
      isStreamlitMessage: true,
      type: 'streamlit:setComponentValue',
      value,
      dataType: 'json'
    }, '*');
  }

  function rounded(x, y, w, h, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function label(t, x, y, size = 15, color = '#665770', align = 'center') {
    ctx.font = `${size}px system-ui, 'Noto Sans KR', sans-serif`;
    ctx.fillStyle = color;
    ctx.textAlign = align;
    ctx.fillText(t, x, y);
  }

  function drawTree(x, y, s = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);

    ctx.fillStyle = '#b7a087';
    ctx.fillRect(-6, 3, 12, 26);

    ctx.fillStyle = '#a6d99c';
    ctx.beginPath();
    ctx.arc(0, -8, 27, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#8dce94';
    ctx.beginPath();
    ctx.arc(-15, 1, 20, 0, Math.PI * 2);
    ctx.arc(15, 1, 20, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#bde7a8';
    ctx.beginPath();
    ctx.arc(-6, -18, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawHouse(b) {
    const x = b.x, y = b.y;

    ctx.fillStyle = '#ad987e33';
    ctx.beginPath();
    ctx.ellipse(x + b.w / 2, y + b.h + 8, b.w * 0.55, 13, 0, 0, Math.PI * 2);
    ctx.fill();

    rounded(x, y + 22, b.w, b.h - 22, 16, b.wall);

    ctx.fillStyle = b.roof;
    ctx.beginPath();
    ctx.moveTo(x - 12, y + 28);
    ctx.lineTo(x + b.w / 2, y - 30);
    ctx.lineTo(x + b.w + 12, y + 28);
    ctx.closePath();
    ctx.fill();

    rounded(x + 18, y + 48, 30, 28, 7, '#c6eaf3');
    rounded(x + b.w - 48, y + 48, 30, 28, 7, '#c6eaf3');
    rounded(x + b.w / 2 - 13, y + b.h - 37, 26, 37, 8, b.door);

    ctx.fillStyle = '#fff8e9';
    ctx.beginPath();
    ctx.ellipse(x + b.w / 2, y + b.h + 8, b.w * 0.68, 15, 0, 0, Math.PI * 2);
    ctx.fill();

    label(b.icon + ' ' + b.name, x + b.w / 2, y + b.h + 13, 15, '#65546e');
  }

  function drawFlower(x, y, r, h) {
    const colors = ['#fff2a8', '#fffaff', '#e6c1ff', '#ffb9d2', '#b9e8f1'];

    ctx.strokeStyle = '#7fbe7f';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y + 4);
    ctx.lineTo(x, y + 12);
    ctx.stroke();

    for (let a = 0; a < 5; a++) {
      ctx.fillStyle = colors[h % colors.length];
      ctx.beginPath();
      ctx.arc(
        x + Math.cos(a * 1.256) * r * 0.85,
        y + Math.sin(a * 1.256) * r * 0.85,
        r * 0.65,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }

    ctx.fillStyle = '#f4d66b';
    ctx.beginPath();
    ctx.arc(x, y, r * 0.45, 0, Math.PI * 2);
    ctx.fill();
  }

  // 머리, 몸통, 팔, 다리, 신발이 있는 전신 캐릭터
  function drawPlayer(x, y, walk, face, character) {
    const outfit = character.outfit || '#ffb7cf';
    const hair = character.hair || '#76564f';
    const accent = character.accent || '#ffe6a7';

    const step = Math.sin(walk) * 5;
    const bob = Math.abs(Math.sin(walk)) * 1.7;

    ctx.save();
    ctx.translate(x, y + bob);
    ctx.scale(face < 0 ? -1 : 1, 1);

    // 다리와 신발
    ctx.strokeStyle = '#f3c4a6';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';

    ctx.beginPath();
    ctx.moveTo(-5, 13);
    ctx.lineTo(-6 + step, 23);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(5, 13);
    ctx.lineTo(6 - step, 23);
    ctx.stroke();

    ctx.fillStyle = '#fff7ed';
    ctx.beginPath();
    ctx.ellipse(-7 + step, 24, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.ellipse(7 - step, 24, 5, 3, 0, 0, Math.PI * 2);
    ctx.fill();

    // 팔 흔들기
    ctx.strokeStyle = '#f5c9ac';
